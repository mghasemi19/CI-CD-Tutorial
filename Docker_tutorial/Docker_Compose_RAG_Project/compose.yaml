name: simple-rag

services:
  embeddings:
    build: ./embedding_service
    image: simple-rag-embeddings:1.0
    environment:
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      HF_HOME: /models
    volumes:
      - huggingface-cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 30
      start_period: 120s

  chroma:
    image: chromadb/chroma:1.5.3
    volumes:
      - chroma-data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "echo > /dev/tcp/127.0.0.1/8000"
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 40s

  rag-app:
    build: ./rag_app
    image: simple-rag-app:1.0
    ports:
      - "127.0.0.1:8501:8000"
    env_file:
      - .env
    environment:
      EMBEDDING_URL: http://embeddings:8001
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      DOCS_DIR: /documents
    volumes:
      - ./documents:/documents:ro
    depends_on:
      embeddings:
        condition: service_healthy
      chroma:
        condition: service_healthy

volumes:
  chroma-data:
  huggingface-cache:
